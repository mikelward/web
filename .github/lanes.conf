# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Markdown is docs
# wherever it lives OUTSIDE the shipped trees — prose cannot change the app —
# while anything under templates/, static/, or styles/ is served or rendered
# whatever its extension. Everything else is code — the Python sources,
# app.yaml, the Makefile, requirements.txt, and .gitignore included.
code templates/**
code static/**
code styles/**
docs **/*.md

# The one subject prefix the docs lane accepts. Of AGENTS.md's housekeeping
# prefixes (docs:, test:, build:, refactor:), only docs: names work a
# markdown-only diff can actually contain: test, build, and refactor work all
# carry a non-markdown file and ride the code lane. Accepting them here would
# have the required gate blessing subjects that describe work the diff cannot
# contain.
prefixes docs

# No workflow here declares workflow_dispatch, so no dispatched run is
# legitimate: a PR-less dispatch is refused on every ref.
dispatch-without-pr refuse
